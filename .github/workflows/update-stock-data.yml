name: Update stock data

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-stock-data.yml"
      - "scripts/update_stock_data.py"
  schedule:
    - cron: "7 1 * * 1-5"
    - cron: "37 4 * * 1-5"
    - cron: "7 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stock-data
  cancel-in-progress: true

jobs:
  update-stock-data:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stock JSON files
        run: python scripts/update_stock_data.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update stock data"
          file_pattern: data/universe.json data/stocks/*.json
